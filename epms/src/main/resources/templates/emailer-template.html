<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Email Notification</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 650px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
        }
        .header {
            background: #ef4444;
            padding: 20px;
            text-align: center;
            color: white;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 0.5px;
        }
        .content {
            padding: 25px;
            color: #1e293b;
            font-size: 15px;
            line-height: 1.6;
        }
        .content h2 {
            margin-top: 0;
            font-size: 18px;
            color: #ef4444;
        }
        .badge {
            display: inline-block;
            padding: 6px 12px;
            background: #fee2e2;
            color: #ef4444;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 10px;
        }
        .footer {
            background: #fef2f2;
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
        .footer a {
            color: #ef4444;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>EPMS Notification</h1>
    </div>

    <div class="content">
        <h2>Hello <span th:text="${employeeName}">Employee</span>,</h2>

        <p>
            You have received an important notification regarding the
            <b th:text="${subject}">Subject</b>.
        </p>

        <div class="badge">
            Cycle Type: <span th:text="${cycleType}">Cycle</span>
        </div>

        <p style="margin-top: 20px;" th:utext="${content}">
            Email content goes here...
        </p>

        <p style="margin-top: 30px;">
            Regards,<br>
            <b>EPMS Team</b>
        </p>
    </div>

    <div class="footer">
        This is an auto-generated email from EPMS. Please do not reply.<br>
        Need help? Contact <a href="mailto:support@epms.com">support@epms.com</a>
    </div>

</div>
</body>
</html>
